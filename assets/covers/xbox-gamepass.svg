<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="xboxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081408"/>
      <stop offset="50%" stop-color="#0e280e"/>
      <stop offset="100%" stop-color="#144d14"/>
    </linearGradient>
    <linearGradient id="xboxGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#107c10"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="greenGlow" cx="80%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#081408" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#xboxBg)"/>
  <circle cx="680" cy="180" r="280" fill="url(#greenGlow)"/>

  <!-- Логотип Xbox на фоне -->
  <g transform="translate(680, 210) scale(1.1)" opacity="0.85" filter="url(#shadow)">
    <circle cx="0" cy="0" r="90" fill="#107c10"/>
    <!-- Крестовина Xbox -->
    <path d="M-62,-62 C-30,-30 30,-30 62,-62 C40,-10 -40,-10 -62,-62 Z" fill="#081408"/>
    <path d="M-62,62 C-30,30 30,30 62,62 C40,10 -40,10 -62,62 Z" fill="#081408"/>
    <path d="M-62,-62 C-40,-10 -40,10 -62,62 C-80,0 -80,-30 -62,-62 Z" fill="#081408"/>
    <path d="M62,-62 C40,-10 40,10 62,62 C80,0 80,-30 62,-62 Z" fill="#081408"/>
  </g>

  <!-- Верхний бейдж -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="310" height="34" rx="6" fill="#107c10" fill-opacity="0.25" stroke="#22c55e" stroke-width="1.5"/>
    <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#22c55e" letter-spacing="1">
      ⚡ 400+ ТОПОВЫХ ИГР • ПК + XBOX
    </text>
  </g>

  <!-- Заголовок -->
  <g transform="translate(50, 135)" filter="url(#shadow)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      XBOX GAME PASS
    </text>
    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#xboxGreen)" letter-spacing="-0.5">
      ULTIMATE ПОДПИСКА
    </text>
  </g>

  <!-- Описание -->
  <g transform="translate(50, 235)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#d4eed4">
      Библиотека из сотен хитов: Forza, Halo, Starfield, Minecraft + EA Play
    </text>
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#8cb38c">
      Активация на ПК и консолях. Мгновенная доставка кода активации!
    </text>
  </g>

  <!-- Теги -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="160" height="42" rx="8" fill="#102e10" stroke="#22c55e" stroke-width="1.5"/>
    <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#22c55e">
      🔥 СКИДКА ДО 55%
    </text>

    <rect x="175" y="0" width="165" height="42" rx="8" fill="#102e10" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="195" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
      🎁 EA PLAY ВНУТРИ
    </text>

    <rect x="355" y="0" width="160" height="42" rx="8" fill="#102e10" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="375" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
      ⚡ АВТОВЫДАЧА
    </text>
  </g>

  <rect x="0" y="444" width="800" height="6" fill="url(#xboxGreen)"/>
</svg>
