<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Градиент фона -->
    <linearGradient id="robloxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f13"/>
      <stop offset="45%" stop-color="#16151f"/>
      <stop offset="100%" stop-color="#241426"/>
    </linearGradient>

    <!-- Градиент акцентный Roblox / Robux -->
    <linearGradient id="robloxRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="50%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>

    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff8800"/>
    </linearGradient>

    <linearGradient id="silverPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2c38"/>
      <stop offset="100%" stop-color="#181922"/>
    </linearGradient>

    <!-- Радиальное свечение -->
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3b30" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0e0f13" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa00" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0e0f13" stop-opacity="0"/>
    </radialGradient>

    <!-- Фильтр тени -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.75"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ff4433" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Фон -->
  <rect width="800" height="450" fill="url(#robloxBg)"/>

  <!-- Фоновые световые пятна -->
  <circle cx="680" cy="180" r="260" fill="url(#redGlow)"/>
  <circle cx="200" cy="380" r="220" fill="url(#goldAmbient)"/>

  <!-- Декоративная фоновая сетка / геометрические линии -->
  <path d="M-50,130 L850,210 M-50,270 L850,350 M200,-50 L350,500 M550,-50 L700,500" stroke="rgba(255,255,255,0.025)" stroke-width="2"/>
  <circle cx="670" cy="225" r="150" stroke="rgba(255,59,48,0.18)" stroke-width="2" fill="none"/>
  <circle cx="670" cy="225" r="195" stroke="rgba(255,170,0,0.12)" stroke-width="1.5" stroke-dasharray="10 8" fill="none"/>

  <!-- Фирменный логотип Roblox & символ Robux справа -->
  <g transform="translate(670, 225)" filter="url(#dropShadow)">
    <!-- Фоновый стилизованный шестиугольник / медальон Robux -->
    <polygon points="0,-105 90,-52 90,52 0,105 -90,52 -90,-52" fill="url(#silverPlate)" stroke="#ff3b30" stroke-width="4"/>
    
    <!-- Внутренний золотистый контур -->
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="none" stroke="url(#goldGlow)" stroke-width="2" opacity="0.6"/>

    <!-- Наклонный квадрат Roblox (наклон ~15 градусов) -->
    <g transform="rotate(15)">
      <!-- Внешний квадрат -->
      <rect x="-46" y="-46" width="92" height="92" rx="14" fill="#ffffff" filter="url(#softGlow)"/>
      <!-- Внутреннее отверстие куба -->
      <rect x="-18" y="-18" width="36" height="36" rx="5" fill="#16151f"/>
    </g>

    <!-- Символ валюты R$ внизу медальона -->
    <g transform="translate(0, 68)">
      <rect x="-32" y="-12" width="64" height="24" rx="12" fill="url(#robloxRed)"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
        ROBUX
      </text>
    </g>
  </g>

  <!-- Верхний бейдж "АВТОВЫДАЧА • ПО НИКНЕЙМУ" -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="340" height="34" rx="6" fill="#ff3b30" fill-opacity="0.15" stroke="#ff3b30" stroke-width="1.5"/>
    <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ff4d4d" letter-spacing="1">
      ⚡ МОМЕНТАЛЬНО ПО НИКНЕЙМУ • БЕЗ ПАРОЛЯ
    </text>
  </g>

  <!-- Главный заголовок -->
  <g transform="translate(50, 135)" filter="url(#dropShadow)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      ПОПОЛНЕНИЕ
    </text>
    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#robloxRed)" letter-spacing="-0.5">
      ROBLOX ROBUX
    </text>
  </g>

  <!-- Подзаголовок с условиями -->
  <g transform="translate(50, 235)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#e8e9ed">
      Пакеты от 400 R$ • Выгодный курс 1 R$ = 1.25 ₽
    </text>
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#9ba1b0">
      Официальное зачисление по никнейму. Без передачи пароля от аккаунта!
    </text>
  </g>

  <!-- Теги внизу слева -->
  <g transform="translate(50, 320)">
    <!-- Тег 1: Комиссия -->
    <rect x="0" y="0" width="160" height="42" rx="8" fill="#1c1b24" stroke="#ff3b30" stroke-width="1.5"/>
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#ff5544">
      🔥 КОМИССИЯ 5%
    </text>

    <!-- Тег 2: Безопасность -->
    <rect x="175" y="0" width="165" height="42" rx="8" fill="#1c1b24" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="195" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
      🛡️ 100% БЕЗОПАСНО
    </text>

    <!-- Тег 3: Автовыдача -->
    <rect x="355" y="0" width="160" height="42" rx="8" fill="#1c1b24" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="375" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#10b981">
      ⚡ 1-2 МИНУТЫ
    </text>
  </g>

  <!-- Декоративная плашка снизу -->
  <rect x="0" y="444" width="800" height="6" fill="url(#robloxRed)"/>
</svg>
