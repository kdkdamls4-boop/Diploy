<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="eaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a0a"/>
      <stop offset="60%" stop-color="#241010"/>
      <stop offset="100%" stop-color="#3d1515"/>
    </linearGradient>
    <linearGradient id="eaOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4747"/>
      <stop offset="100%" stop-color="#ff7300"/>
    </linearGradient>
    <radialGradient id="eaGlow" cx="80%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ff4747" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#eaBg)"/>
  <circle cx="680" cy="180" r="280" fill="url(#eaGlow)"/>

  <!-- Логотип EA Play на фоне -->
  <g transform="translate(680, 210) scale(1.1)" opacity="0.9" filter="url(#shadow)">
    <circle cx="0" cy="0" r="95" fill="#1f1111" stroke="url(#eaOrange)" stroke-width="6"/>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="url(#eaOrange)" text-anchor="middle" letter-spacing="2">
      EA
    </text>
  </g>

  <!-- Верхний бейдж -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="310" height="34" rx="6" fill="#ff4747" fill-opacity="0.2" stroke="#ff4747" stroke-width="1.5"/>
    <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ff4747" letter-spacing="1">
      ⚡ НОВИНКИ EA В ДЕНЬ РЕЛИЗА • EA APP
    </text>
  </g>

  <!-- Заголовок -->
  <g transform="translate(50, 135)" filter="url(#shadow)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      EA PLAY PRO
    </text>
    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#eaOrange)" letter-spacing="-0.5">
      ПОДПИСКА НА ИГРЫ
    </text>
  </g>

  <!-- Описание -->
  <g transform="translate(50, 235)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#ffdada">
      Полный доступ: FC 25, Battlefield, Star Wars, Dead Space, NFS
    </text>
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#b88d8d">
      Максимальные издания с эксклюзивными внутриигровыми бонусами!
    </text>
  </g>

  <!-- Теги -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="160" height="42" rx="8" fill="#301414" stroke="#ff4747" stroke-width="1.5"/>
    <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ff4747">
      ⚽ FC 25 &amp; BF
    </text>

    <rect x="175" y="0" width="165" height="42" rx="8" fill="#241515" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="195" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
      ⚡ АВТОВЫДАЧА
    </text>

    <rect x="355" y="0" width="160" height="42" rx="8" fill="#241515" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="375" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#10b981">
      🛡️ ОФИЦИАЛЬНО
    </text>
  </g>

  <rect x="0" y="444" width="800" height="6" fill="url(#eaOrange)"/>
</svg>
