<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="psBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02122c"/>
      <stop offset="50%" stop-color="#002d72"/>
      <stop offset="100%" stop-color="#00439c"/>
    </linearGradient>
    <linearGradient id="psBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2997ff"/>
      <stop offset="100%" stop-color="#0070d1"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#0070d1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Фон -->
  <rect width="800" height="450" fill="url(#psBg)"/>
  <circle cx="680" cy="180" r="260" fill="url(#glow)"/>

  <!-- Фирменные символы PlayStation на фоне (△ ○ ✕ □) -->
  <g fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6" transform="translate(480, 70)">
    <!-- Треугольник -->
    <polygon points="120,40 160,110 80,110" stroke="#00e5ff" stroke-opacity="0.2"/>
    <!-- Круг -->
    <circle cx="240" cy="75" r="35" stroke="#ff385c" stroke-opacity="0.2"/>
    <!-- Крест -->
    <line x1="85" y1="165" x2="155" y2="235" stroke="#3b82f6" stroke-opacity="0.2"/>
    <line x1="155" y1="165" x2="85" y2="235" stroke="#3b82f6" stroke-opacity="0.2"/>
    <!-- Квадрат -->
    <rect x="205" y="165" width="70" height="70" stroke="#ff69b4" stroke-opacity="0.2"/>
  </g>

  <!-- Верхний бейдж -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="310" height="34" rx="6" fill="#0070d1" fill-opacity="0.2" stroke="#2997ff" stroke-width="1.5"/>
    <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#2997ff" letter-spacing="1">
      ⚡ КАРТЫ ПОПОЛНЕНИЯ • PS4 / PS5
    </text>
  </g>

  <!-- Заголовок -->
  <g transform="translate(50, 135)" filter="url(#shadow)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      ПОПОЛНЕНИЕ
    </text>
    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#psBlue)" letter-spacing="-0.5">
      PLAYSTATION STORE
    </text>
  </g>

  <!-- Описание -->
  <g transform="translate(50, 235)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#d1e3ff">
      Официальные цифровые коды PSN для игр, DLC и подписок
    </text>
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#8da4c4">
      Моментальная выдача ключа сразу после подтверждения заказа. 100% гарантия!
    </text>
  </g>

  <!-- Теги снизу -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="160" height="42" rx="8" fill="#031d44" stroke="#2997ff" stroke-width="1.5"/>
    <text x="22" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#2997ff">
      🎮 PS4 / PS5
    </text>

    <rect x="175" y="0" width="165" height="42" rx="8" fill="#031d44" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="195" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
      ⚡ АВТОВЫДАЧА
    </text>

    <rect x="355" y="0" width="160" height="42" rx="8" fill="#031d44" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="375" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#10b981">
      🛡️ ОФИЦИАЛЬНО
    </text>
  </g>

  <rect x="0" y="444" width="800" height="6" fill="url(#psBlue)"/>
</svg>
