<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="psPlusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="60%" stop-color="#141c33"/>
      <stop offset="100%" stop-color="#2d2208"/>
    </linearGradient>
    <linearGradient id="goldPlus" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="80%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#psPlusBg)"/>
  <circle cx="680" cy="180" r="280" fill="url(#goldGlow)"/>

  <!-- Золотой крест PS Plus на фоне -->
  <g transform="translate(680, 210) scale(1.1)" opacity="0.9" filter="url(#shadow)">
    <circle cx="0" cy="0" r="95" fill="#1e1e24" stroke="url(#goldPlus)" stroke-width="6"/>
    <!-- Знак + -->
    <rect x="-18" y="-60" width="36" height="120" rx="8" fill="url(#goldPlus)"/>
    <rect x="-60" y="-18" width="120" height="36" rx="8" fill="url(#goldPlus)"/>
  </g>

  <!-- Верхний бейдж -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="310" height="34" rx="6" fill="#f59e0b" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#fbbf24" letter-spacing="1">
      ⚡ КАТАЛОГ 400+ ИГР • PS4 / PS5
    </text>
  </g>

  <!-- Заголовок -->
  <g transform="translate(50, 135)" filter="url(#shadow)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      PLAYSTATION PLUS
    </text>
    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#goldPlus)" letter-spacing="-0.5">
      EXTRA &amp; DELUXE ПОДПИСКА
    </text>
  </g>

  <!-- Описание -->
  <g transform="translate(50, 235)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#fff4d4">
      Огромный каталог хитов Sony, мультиплеер, ежемесячные игры и облако
    </text>
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#bfae8a">
      Подходит для аккаунтов всех регионов. Моментальная доставка кода!
    </text>
  </g>

  <!-- Теги -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="160" height="42" rx="8" fill="#2d2208" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="22" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#fbbf24">
      ⭐ EXTRA &amp; DELUXE
    </text>

    <rect x="175" y="0" width="165" height="42" rx="8" fill="#1b1c28" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="195" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
      🎮 СЕТЕВАЯ ИГРА
    </text>

    <rect x="355" y="0" width="160" height="42" rx="8" fill="#1b1c28" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="375" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#10b981">
      ⚡ 1-2 МИНУТЫ
    </text>
  </g>

  <rect x="0" y="444" width="800" height="6" fill="url(#goldPlus)"/>
</svg>
